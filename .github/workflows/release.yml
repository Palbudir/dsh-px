name: release-build
run-name: dsh-px-build:${{ inputs.head }}:${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact candidate commit SHA
        required: true
        type: string
      version:
        description: Candidate package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Validate candidate identity
        shell: pwsh
        env:
          BUILD_HEAD: ${{ inputs.head }}
        run: if ($env:BUILD_HEAD -notmatch '^[a-f0-9]{40}$') { throw 'Exact SHA required' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Install package inspection tools
        run: choco install 7zip -y --no-progress
      - name: Install locked candidate dependencies
        working-directory: candidate
        run: npm ci
      - name: Build and inspect without publication credentials
        working-directory: candidate
        env:
          BUILD_HEAD: ${{ inputs.head }}
          BUILD_VERSION: ${{ inputs.version }}
        run: node ../controller/scripts/release-package.mjs
      - name: Verify candidate remains unchanged
        working-directory: candidate
        shell: pwsh
        env:
          BUILD_HEAD: ${{ inputs.head }}
        run: |
          if ((git rev-parse HEAD) -ne $env:BUILD_HEAD) { throw 'Candidate checkout changed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked candidate files changed' }
      - name: Upload inspected release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.head }}-${{ github.run_attempt }}
          path: candidate/dist/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
