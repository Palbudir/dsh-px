name: review-request

on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# This workflow reads event metadata only. It never checks out or executes PR code.
jobs:
  request:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const pr = context.payload.pull_request;
            const branch = context.payload.repository.default_branch;
            const head = pr?.head.sha ?? context.sha;
            let base = pr?.base.sha;
            if (!base && context.ref === `refs/heads/${branch}`) {
              const commit = await github.rest.repos.getCommit({...context.repo, ref: head});
              base = commit.data.parents[0]?.sha;
            }
            if (!base) base = (await github.rest.repos.getBranch({...context.repo, branch})).data.commit.sha;
            if (!/^[a-f0-9]{40}$/.test(head) || !/^[a-f0-9]{40}$/.test(base)) throw new Error('Invalid review identity');
            fs.writeFileSync('request.json', JSON.stringify({version: 1, repository: repo,
              headRepository: pr?.head.repo.full_name ?? repo, head, base,
              kind: pr ? 'pull_request' : 'push', pullRequest: pr?.number ?? null,
              runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)}));
            core.notice('Awaiting the trusted local reviewer. A missing result does not pass the required independent-review check.');
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-request-${{ github.run_attempt }}
          path: request.json
          retention-days: 90
          if-no-files-found: error
