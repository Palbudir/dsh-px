name: trusted-quality
run-name: dsh-px-quality:${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/master'
    name: trusted-quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate commit identity
        shell: pwsh
        env:
          REVIEW_HEAD: ${{ inputs.head }}
        run: if ($env:REVIEW_HEAD -notmatch '^[a-f0-9]{40}$') { throw 'Exact SHA required' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          path: candidate
          persist-credentials: false
          # Full history: review-graph regression tests read historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Secret scan of the candidate
        working-directory: candidate
        run: node scripts/check-secrets.mjs
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci
      - name: Run trusted quality controller
        working-directory: candidate
        run: node ../controller/scripts/release-quality.mjs
      - name: Verify tested commit
        working-directory: candidate
        shell: pwsh
        env:
          REVIEW_HEAD: ${{ inputs.head }}
        run: |
          if ((git rev-parse HEAD) -ne $env:REVIEW_HEAD) { throw 'Checkout changed during tests' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked files changed during tests' }
