name: verify

# beta 门禁。这个工作流正是"至少达到官方 dsh 能力"从一个口号变成一条可检查主张的原因：
# 它从零装配一份运行时，然后把组合出的插件树与官方安装的树逐行 diff。
#
# 注意：平价检查针对的是 scripts/stage-runtime.mjs 里锁定的那个 dsh 版本。
# 请有意地去改 DSH_PX_DSH_VERSION；如果某次升级导致行数减少，这个工作流就会失败 ——
# 这正是它存在的意义。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      - name: 安装开发依赖
        run: npm install

      - name: 装配运行时（Node + dsh + 从 npm 构建 profile）
        run: npm run stage -- --with-plugins

      - name: 验证能力平价
        run: npm run verify -- --boot --json

      - name: 上传装配清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ matrix.os }}
          path: runtime/runtime-manifest.json
          if-no-files-found: warn
