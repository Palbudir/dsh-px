name: verify

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR commits run once here; superseded commits do not keep consuming runners.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          # Full history supports exact source checks and change-based upstream verification.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Shared quality gates
        run: node scripts/release-quality.mjs
      - name: Determine whether upstream contracts need verification
        if: matrix.os == 'ubuntu-latest'
        id: upstream
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          needed=true
          if [[ "$EVENT" != workflow_dispatch && "$BASE" =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changes=$(git diff --name-only "$BASE" "$HEAD")
            if ! printf '%s\n' "$changes" | grep -E '^(config/|scripts/(upstream-contracts|verify-upstream-lock|prepare-native-desktop|build-native-pack)|test/upstream-contracts|packages/shared/native-|\.github/workflows/)' >/dev/null; then
              needed=false
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Pinned upstream contracts match their SRI
        if: matrix.os == 'ubuntu-latest' && steps.upstream.outputs.needed == 'true'
        run: node scripts/verify-upstream-lock.mjs
