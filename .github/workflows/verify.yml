name: verify

# 运行时结构门禁：从零装配并与官方插件树比较，同时验证启动。
# 模型行为与完整任务能力另按 docs/agent-maturity-2026-09-22/evaluations.md 验收。
#
# 重要教训：这个 workflow 在最初几版里**从未真正构建过任何东西** ——
# stage 脚本那时依赖"本机已装全局 dsh"，而 CI 上根本没有，
# 于是每次都在这步失败。现在 stage 脚本会在缺少全局 dsh 时
# **从 npm 安装锁定版本**（`installDshFromNpm`），CI 才真正跑起来。
#
# 注意：平价检查针对 scripts/stage-runtime.mjs 里锁定的 dsh 版本。
# 请有意地去改 DSH_PX_DSH_VERSION；若某次升级导致行数减少，这个工作流就会失败 ——
# 这正是它存在的意义。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 用官方 action 固定 pnpm 版本，而不是 `npm install -g pnpm`
      # （后者会往全局前缀写文件，在托管 runner 上偶发权限问题）。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装开发依赖
        run: npm install

      # 与 release 保持一致：校验脚本在需要时会用到 7-Zip。
      # verify 本身不校验安装包，但保持一致可避免日后在此新增校验时踩同一个坑。
      - name: 安装 7-Zip（Windows）
        if: runner.os == 'Windows'
        run: choco install 7zip -y --no-progress

      # 先跑 TypeScript 与单元测试，再花几分钟装配运行时。
      #
      # 顺序是刻意的：typecheck/test 是秒级的，装配是分钟级的。把它们放在前面，
      # 类型错误或单测失败会立刻反馈，而不是等装配跑完才报出来。
      #
      # `npm run test` 同时会重建客户端半边（lib/client.js）并校验其形态 ——
      # 那个产物是入库的，若与源码漂移，症状是"设置页少了这一项"或前端静默报错，
      # 很难定位，所以必须在门禁里卡住。
      - name: 类型检查
        run: npm run typecheck

      - name: 插件清单与源码格式
        run: npm run check:repo

      - name: 审计清单与生成文档一致性
        run: |
          node scripts/build-agent-audit.mjs
          git diff --exit-code -- docs/agent-maturity-2026-09-22/feature-catalog.md docs/agent-maturity-2026-09-22/findings.md docs/agent-maturity-2026-09-22/index.html

      - name: 单元测试
        run: npm run test

      - name: 预构建插件与源码一致
        run: git diff --exit-code -- packages

      - name: 装配运行时（Node + dsh + 从 npm 构建 profile）
        run: npm run stage -- --with-plugins

      - name: 验证运行时组合与启动
        run: npm run verify -- --boot --json

      - name: 上传装配清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ matrix.os }}
          path: runtime/runtime-manifest.json
          if-no-files-found: warn
