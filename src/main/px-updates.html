<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'"
    />
    <title>DSH-PX 更新</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        background: light-dark(#f7f8fa, #15171b);
        color: light-dark(#20232a, #eee);
      }
      body {
        margin: 0;
        padding: 28px;
      }
      h1 {
        font-size: 23px;
        margin: 0 0 6px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: light-dark(#656a75, #afb4bf);
      }
      section {
        padding: 20px;
        border: 1px solid light-dark(#e0e3e8, #373a42);
        border-radius: 14px;
        background: light-dark(white, #21242a);
        margin-top: 18px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .version {
        font-size: 13px;
        color: light-dark(#656a75, #afb4bf);
      }
      .status {
        font-size: 14px;
        margin: 12px 0;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        font-size: 13px;
        border: 1px solid light-dark(#cad0d9, #545b69);
        border-radius: 8px;
        padding: 7px 12px;
        background: light-dark(#fff, #303641);
        color: inherit;
        cursor: pointer;
        margin: 0 8px 0 0;
      }
      button.primary {
        background: #3265d8;
        color: #fff;
        border-color: #3265d8;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      progress {
        display: block;
        width: 100%;
        height: 8px;
        accent-color: #3265d8;
        margin: 10px 0;
      }
      .error {
        color: light-dark(#b52929, #ff9393);
      }
      .note {
        margin-bottom: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>DSH-PX 更新</h1>
    <p>客户端与插件整合包分别更新。下载完成后，由你确认重启。</p>
    <section id="pack">
      <h2>插件整合包</h2>
      <div class="version"></div>
      <div class="status" role="status"></div>
      <div class="notice error" role="status" hidden></div>
      <progress max="100" hidden></progress>
      <div class="actions">
        <button data-action="check-pack">检查更新</button
        ><button class="primary" data-action="download-pack" hidden>下载更新</button
        ><button class="primary" data-action="install-pack" hidden>重启并更新</button>
      </div>
      <p class="note">更新全部 PX 基础组件与功能包，保留会话、设置和已停用的插件。</p>
    </section>
    <section id="desktop">
      <h2>桌面客户端</h2>
      <div class="version"></div>
      <div class="status" role="status"></div>
      <div class="notice error" role="status" hidden></div>
      <progress max="100" hidden></progress>
      <div class="actions">
        <button data-action="check-desktop">检查更新</button
        ><button class="primary" data-action="download-desktop" hidden>下载更新</button
        ><button class="primary" data-action="install-desktop" hidden>安装并重启</button>
      </div>
      <p class="note">优先下载有变化的数据；缺少可用基线时自动使用完整安装包。</p>
    </section>
    <p id="recovery" class="error" role="status"></p>
    <script src="./px-updates-renderer.js"></script>
  </body>
</html>
